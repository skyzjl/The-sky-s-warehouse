<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STELLAR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;user-select:none;color:#fff;-webkit-font-smoothing:antialiased}
canvas{touch-action:none;max-width:100%;max-height:100%;display:block}
#cover{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:50px;z-index:100;transition:opacity .6s,visibility .6s}
.tl{position:absolute;top:30px;left:30px;display:flex;align-items:center;gap:12px;z-index:10}
.ib,.gp,#pb,.btn{background:rgba(255,255,255,.08);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:.5px solid rgba(255,255,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.ib{pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;height:44px;border-radius:14px;transition:all .5s cubic-bezier(.16,1,.3,1);color:rgba(255,255,255,.9)}
.ib:active{transform:scale(.94);background:rgba(255,255,255,.15)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
#set{width:44px}
#lang{padding:0 18px;font-size:13px;font-weight:500;letter-spacing:.5px}
#ui{position:absolute;top:30px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;opacity:0;transition:opacity .5s}
#ui.on{opacity:1}
.gp{border-radius:14px;padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:.5px}
#pb{pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;transition:all .5s cubic-bezier(.16,1,.3,1)}
#pb:active{transform:scale(.94);background:rgba(255,255,255,.15)}
#pb svg{width:24px;height:24px;fill:rgba(255,255,255,.9)}
#hint{position:absolute;bottom:40px;width:100%;text-align:center;color:rgba(255,255,255,.4);font-size:13px;letter-spacing:1.5px;pointer-events:none;transition:opacity 1s;opacity:0}
#hint.on{opacity:1}
.logo{width:90px;height:90px;display:flex;justify-content:center;align-items:center}
.logo svg{width:100%;height:100%;overflow:visible;fill:#fff}
.title{font-size:42px;font-weight:200;font-style:italic;letter-spacing:24px;text-indent:24px;text-transform:uppercase;transform:scaleX(1.1) skewX(-8deg);text-shadow:0 2px 20px rgba(255,255,255,.08)}
.bg{display:flex;flex-direction:column;gap:16px;width:280px}
.btn{color:#fff;padding:20px 0;font-size:16px;font-weight:600;letter-spacing:3px;border-radius:999px;cursor:pointer;transition:all .5s cubic-bezier(.16,1,.3,1);outline:none;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.btn:active{transform:scale(.96);background:rgba(255,255,255,.15)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;visibility:hidden;transform:translateY(30px) scale(.95);transition:all .5s cubic-bezier(.16,1,.3,1);z-index:200}
.ov.on{opacity:1;visibility:visible;transform:none}
.card{position:relative;width:85%;max-width:320px;background:rgba(28,28,30,.75);border:.5px solid rgba(255,255,255,.1);border-radius:24px;padding:35px 25px;box-shadow:0 20px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:24px}
.tt{font-size:16px;font-weight:600;letter-spacing:2px;margin-bottom:8px;text-align:center}
.tr{display:flex;align-items:center;color:rgba(255,255,255,.75);font-size:14px;letter-spacing:.5px;padding:2px 0}
.tr::before{content:"";width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.4);margin-right:14px;flex-shrink:0}
.sg{display:flex;flex-direction:column;gap:16px}
.sl{font-size:12px;letter-spacing:1.5px;color:rgba(255,255,255,.5);text-align:center;font-weight:500}
.row{display:flex;justify-content:space-around;align-items:center;padding:15px 0;touch-action:none}
.dopt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);transition:all .5s cubic-bezier(.34,1.56,.64,1);position:relative}
.dopt.on .dot{background:#fff;border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.6);transform:scale(1.15)}
.dl{font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.4);transition:all .5s cubic-bezier(.16,1,.3,1);font-weight:500}
.dopt.on .dl{color:#fff}
.crow{display:flex;justify-content:space-between;padding:15px 10px;margin:0 -5px;touch-action:none}
.co{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .5s cubic-bezier(.34,1.56,.64,1);box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.co.on{border-color:#fff;transform:scale(1.2);box-shadow:0 0 20px rgba(255,255,255,.5),inset 0 2px 4px rgba(0,0,0,.2)}
.pc{gap:16px;padding:30px 25px}
.gc{gap:15px;padding:40px 25px;align-items:center}
.gt{font-size:14px;letter-spacing:4px;color:rgba(255,255,255,.5);text-indent:4px}
.gs{font-size:56px;font-weight:300;line-height:1.1}
.gb{font-size:14px;color:rgba(255,255,255,.4);margin-bottom:5px}
.gr{background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.2);padding:6px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:2px;text-indent:2px;box-shadow:0 0 20px rgba(255,255,255,.15);display:none}
.gr.on{display:block}
.ga{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:10px}
#cb{margin-left:6px;font-size:11px;color:#a8e6cf;letter-spacing:.5px;display:none}
</style>
</head>
<body>

<div id="cover">
  <div class="tl">
    <div id="set" class="ib" onclick="showSettings()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    <div id="lang" class="ib" onclick="toggleLang()">EN</div>
  </div>
  <div class="logo"><svg viewBox="0 0 100 100"><path d="M50 5 C55 35 65 45 95 50 C65 55 55 65 50 95 C45 65 35 55 5 50 C35 45 45 35 50 5 Z"/></svg></div>
  <div class="title">STELLAR</div>
  <div class="bg"><button class="btn" id="sbtn" onclick="startClick()">开始游戏</button></div>
</div>

<div id="tut" class="ov">
  <div class="card">
    <div class="tt" id="tt"></div>
    <div class="tr" id="t1"></div>
    <div class="tr" id="t2"></div>
    <div class="tr" id="t3"></div>
    <button class="btn" id="ts" onclick="startGame()" style="margin-top:10px">开始游戏</button>
  </div>
</div>

<div id="setov" class="ov">
  <div class="card">
    <div class="sg">
      <div class="sl" id="ld"></div>
      <div class="row" id="drow">
        <div class="dopt" id="de" onclick="setDiff('easy')"><div class="dot"></div><div class="dl" id="le"></div></div>
        <div class="dopt" id="dn" onclick="setDiff('normal')"><div class="dot"></div><div class="dl" id="ln"></div></div>
        <div class="dopt" id="dh" onclick="setDiff('hard')"><div class="dot"></div><div class="dl" id="lh"></div></div>
      </div>
    </div>
    <div class="sg">
      <div class="sl" id="lc"></div>
      <div class="crow" id="crow"></div>
    </div>
  </div>
</div>

<div id="pm" class="ov">
  <div class="card pc">
    <button class="btn" id="ph" onclick="goHome()">返回主界面</button>
    <button class="btn" id="pr" onclick="resumeGame()">继续游戏</button>
  </div>
</div>

<div id="gov" class="ov">
  <div class="card gc">
    <div class="gt" id="gt"></div>
    <div class="gs" id="gs">0</div>
    <div class="gb" id="gb"></div>
    <div class="gr" id="gr"></div>
    <div class="ga">
      <button class="btn" id="gre" onclick="restartGame()">重新开始</button>
      <button class="btn" id="ghm" onclick="goHome()">返回主界面</button>
    </div>
  </div>
</div>

<div id="ui">
  <div style="display:flex;align-items:center;gap:12px">
    <div id="pb" onclick="pauseGame()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="rgba(255,255,255,0.9)"/></svg></div>
    <div class="gp"><span id="sl">分数</span> <span id="sc" style="color:#f8b4b4">0</span><span id="cb">×1</span></div>
  </div>
  <div class="gp"><span id="ll">生命</span> <span id="lv" style="color:#a8e6cf">3</span></div>
</div>
<div id="hint"></div>
<canvas id="c" width="480" height="800"></canvas>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');

const T={
zh:{start:"开始游戏",diff:"难度",easy:"简单",normal:"普通",hard:"困难",color:"飞船颜色",score:"分数",lives:"生命",hint:"拖动移动 · 自动开火",title:"玩法介绍",t1:"拖动屏幕，移动飞船",t2:"自动开火，击碎陨石",t3:"避免碰撞，保持生命",resume:"继续游戏",home:"返回主界面",over:"得分",best:"最高分: ",record:"新纪录！",restart:"重新开始"},
en:{start:"START",diff:"DIFFICULTY",easy:"EASY",normal:"NORMAL",hard:"HARD",color:"SHIP COLOR",score:"SCORE",lives:"LIVES",hint:"DRAG TO MOVE · AUTO FIRE",title:"HOW TO PLAY",t1:"Drag to move your ship",t2:"Auto-fire destroys meteors",t3:"Avoid collisions to survive",resume:"RESUME",home:"HOME",over:"SCORE",best:"BEST: ",record:"NEW RECORD!",restart:"RESTART"}
};
let lang=localStorage.getItem('st_lang')||'zh';

const C=[["white","#ffffff","255,255,255"],["mint","#a8e6cf","168,230,207"],["pink","#e2a9ce","226,169,206"],["purple","#c4a5e6","196,165,230"],["orange","#f8b4b4","248,180,180"]];
const DC={easy:{sr:65,mn:1.3,mx:2.8},normal:{sr:40,mn:2,mx:4},hard:{sr:25,mn:3,mx:5}};
let ci=Math.max(0,C.findIndex(c=>c[0]===localStorage.getItem('st_color')));
let playerColor=C[ci];
let diff=DC[localStorage.getItem('st_diff')]?localStorage.getItem('st_diff'):'easy';
let best=parseInt(localStorage.getItem('st_best'))||0;

let ac=null,st=0;
const SND={shoot:['sine',2400,1200,.06,.05],hit:['sine',3000,800,.08,.08],hurt:['triangle',300,100,.12,.15],over:['sine',500,100,.15,.6],ui:['sine',4000,2000,.06,.03],rapid:['triangle',700,1600,.1,.35]};
function ia(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
function snd(t){
  if(!ac||ac.state!=='running')return;
  const P=SND[t];if(!P)return;
  const n=ac.currentTime,[ty,f1,f2,v,d]=P;
  if(t==='shoot'){if(n-st<.05)return;st=n}
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=ty;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);
}
function sndRec(){
  if(!ac||ac.state!=='running')return;
  const n0=ac.currentTime;
  [2000,2600,3200].forEach((f,i)=>{
    const n=n0+i*.08,o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+.1);
    g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.15);
  });
}

function rs(){
  const a=480/800;let w=innerWidth,h=innerHeight;
  if(w/h>a)w=h*a;else h=w/a;
  cv.width=480;cv.height=800;cv.style.width=w+'px';cv.style.height=h+'px';
}
addEventListener('resize',rs);rs();

let P,bul,en,pt,shock,score,lives,over,touching,tx,inv,started=false,setOpen=false,paused=false;
let combo=0,comboTimer=0,shake=0,flash=0,startTime=0,lastSpawnFc=0;
let energy=0,rapidT=0;
let fc=0;
const scEl=$('sc'),lvEl=$('lv'),hintEl=$('hint'),coverEl=$('cover'),tutEl=$('tut'),setEl=$('setov'),pmEl=$('pm'),uiEl=$('ui'),govEl=$('gov'),cbEl=$('cb');

function initGame(){
  ia();
  P={x:240,y:700,r:12,sp:6,tr:[]};
  bul=[];en=[];pt=[];shock=[];
  score=0;lives=3;over=false;fc=0;touching=false;tx=0;inv=0;
  combo=0;comboTimer=0;shake=0;flash=0;energy=0;rapidT=0;
  startTime=performance.now();lastSpawnFc=0;
  scEl.textContent=0;lvEl.textContent=3;
  cbEl.style.display='none';
  started=true;paused=false;
  hintEl.classList.add('on');uiEl.classList.add('on');
  govEl.classList.remove('on');
  $('gr').classList.remove('on');
}

function startClick(){ia();snd('ui');localStorage.getItem('st_tut')?startGame():tutEl.classList.add('on')}
function startGame(){
  tutEl.classList.remove('on');localStorage.setItem('st_tut','1');
  ia();snd('ui');
  coverEl.style.opacity=0;coverEl.style.visibility='hidden';
  setTimeout(()=>coverEl.style.display='none',600);
  initGame();
}

function gameOver(){
  over=true;
  snd('over');
  const isRecord = score>best;
  if(isRecord){
    best=score;
    localStorage.setItem('st_best',best);
    sndRec();
    $('gr').classList.add('on');
  }
  $('gs').textContent=score;
  $('gb').textContent=T[lang].best+best;
  uiEl.classList.remove('on');hintEl.classList.remove('on');
  govEl.classList.add('on');
}

function restartGame(){snd('ui');pmEl.classList.remove('on');govEl.classList.remove('on');initGame()}

function upLang(){
  const t=T[lang];
  $('sbtn').textContent=t.start;$('ts').textContent=t.start;
  $('tt').textContent=t.title;
  $('t1').textContent=t.t1;$('t2').textContent=t.t2;$('t3').textContent=t.t3;
  $('ld').textContent=t.diff;$('le').textContent=t.easy;$('ln').textContent=t.normal;$('lh').textContent=t.hard;
  $('lc').textContent=t.color;$('sl').textContent=t.score;$('ll').textContent=t.lives;
  $('ph').textContent=t.home;$('pr').textContent=t.resume;
  $('gt').textContent=t.over;$('gr').textContent=t.record;
  $('gre').textContent=t.restart;$('ghm').textContent=t.home;
  $('gb').textContent=t.best+best;
  hintEl.textContent=t.hint;
  $('lang').textContent=lang==='zh'?'EN':'中文';
  localStorage.setItem('st_lang',lang);
}
function toggleLang(){snd('ui');lang=lang==='zh'?'en':'zh';upLang()}

function renderColors(){
  const el=$('crow');el.innerHTML='';
  C.forEach(c=>{
    const d=document.createElement('div');
    d.className='co'+(playerColor[0]===c[0]?' on':'');
    d.style.background=c[1];d.dataset.n=c[0];
    el.appendChild(d);
  });
}
let lct=0;
function setColor(c){
  if(playerColor[0]===c[0])return;
  playerColor=c;localStorage.setItem('st_color',c[0]);
  const n=performance.now();
  if(n-lct>80){snd('ui');lct=n}
  document.querySelectorAll('.co').forEach(o=>o.classList.toggle('on',o.dataset.n===c[0]));
}
function setDiff(d){
  if(diff===d)return;
  snd('ui');diff=d;localStorage.setItem('st_diff',d);
  document.querySelectorAll('.dopt').forEach(o=>o.classList.remove('on'));
  $('d'+d[0]).classList.add('on');
}
function slide(el,items,cb){
  let on=false;
  const h=e=>{
    if(!on)return;
    if(e.cancelable)e.preventDefault();
    const r=el.getBoundingClientRect();
    let p=((e.touches?e.touches[0]:e).clientX-r.left)/r.width;
    p=p<0?0:p>1?1:p;
    cb(items[Math.round(p*(items.length-1))]);
  };
  el.addEventListener('touchstart',e=>{on=true;h(e)},{passive:false});
  el.addEventListener('touchmove',h,{passive:false});
  el.addEventListener('touchend',()=>on=false);
  el.addEventListener('mousedown',e=>{on=true;h(e)});
  el.addEventListener('mousemove',h);
  el.addEventListener('mouseup',()=>on=false);
  el.addEventListener('mouseleave',()=>on=false);
}
slide($('crow'),C,setColor);
slide($('drow'),['easy','normal','hard'],setDiff);

function showSettings(){ia();snd('ui');setOpen=true;setEl.classList.add('on');renderColors()}
function closeSettings(){snd('ui');setOpen=false;setEl.classList.remove('on')}

function pauseGame(){if(over||!started)return;snd('ui');paused=true;pmEl.classList.add('on');touching=false}
function resumeGame(){snd('ui');paused=false;pmEl.classList.remove('on')}
function goHome(){
  snd('ui');paused=false;started=false;over=false;
  pmEl.classList.remove('on');govEl.classList.remove('on');
  uiEl.classList.remove('on');hintEl.classList.remove('on');
  coverEl.style.display='flex';
  setTimeout(()=>{coverEl.style.opacity=1;coverEl.style.visibility='visible'},10);
}
tutEl.onclick=e=>{if(e.target===tutEl){snd('ui');tutEl.classList.remove('on')}};
setEl.onclick=e=>{if(e.target===setEl)closeSettings()};

const kk={};
addEventListener('keydown',e=>kk[e.code]=1);
addEventListener('keyup',e=>kk[e.code]=0);

function gx(e){
  const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  return (t.clientX-r.left)*(480/r.width);
}
const block=()=>tutEl.classList.contains('on')||setOpen||paused;
cv.addEventListener('touchstart',e=>{e.preventDefault();if(block()||over)return;ia();touching=true;tx=gx(e);hintEl.classList.remove('on')},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!touching||block())return;tx=gx(e)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();touching=false},{passive:false});
cv.addEventListener('mousedown',e=>{if(block()||over)return;ia();touching=true;tx=gx(e);hintEl.classList.remove('on')});
cv.addEventListener('mousemove',e=>{if(touching&&!block())tx=gx(e)});
cv.addEventListener('mouseup',()=>touching=false);
cv.addEventListener('mouseleave',()=>touching=false);

function burst(x,y,c){for(let i=0;i<8;i++)pt.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,c})}

function update(dt){
  if(over||!started||block())return;
  fc+=dt;
  if(inv>0)inv-=dt;
  if(shake>0)shake-=dt;
  if(flash>0)flash-=dt;
  if(rapidT>0)rapidT-=dt;

  if(combo>0){comboTimer-=dt;if(comboTimer<=0){combo=0;cbEl.style.display='none'}}

  if(touching)P.x+=(tx-P.x)*.2*dt;
  else{
    if(kk.ArrowLeft||kk.KeyA)P.x-=P.sp*dt;
    if(kk.ArrowRight||kk.KeyD)P.x+=P.sp*dt;
  }
  if(P.x<P.r)P.x=P.r;
  if(P.x>480-P.r)P.x=480-P.r;

  P.tr.push({x:P.x,y:P.y,a:1});
  if(P.tr.length>20)P.tr.shift();
  P.tr.forEach(t=>t.a-=.05*dt);

  /* 急速射速：4 帧；正常：8 帧 */
  const si = rapidT>0 ? 4 : 8;
  if((touching||kk.Space)&&fc%si<dt*2){
    bul.push({x:P.x,y:P.y-P.r,r:3,s:8});snd('shoot');
  }

  for(let i=bul.length-1;i>=0;i--){const b=bul[i];b.y-=b.s*dt;if(b.y<0)bul.splice(i,1)}

  const cfg=DC[diff];
  const elapsed=(performance.now()-startTime)/1000;
  const tier=Math.floor(elapsed/15);
  const srNow=Math.max(12,cfg.sr*Math.pow(0.92,tier));
  const mxNow=cfg.mx+0.1*tier;

  if(fc-lastSpawnFc>=srNow){
    lastSpawnFc=fc;
    const r=10+Math.random()*15;
    const roll=Math.random();
    let type=0;
    if(roll<0.10)type=1;
    else if(roll<0.28)type=2;
    en.push({
      x:Math.random()*(480-2*r)+r,y:-30,r,
      s:cfg.mn+Math.random()*(mxNow-cfg.mn),
      rt:Math.random()*Math.PI,rs:(Math.random()-.5)*.05,
      type,
      vx:type===1?(Math.random()<.5?-1:1)*(0.8+Math.random()*0.8):0,
      hp:type===2?2:1
    });
  }

  for(let i=en.length-1;i>=0;i--){
    const e=en[i];
    e.y+=e.s*dt;e.rt+=e.rs*dt;
    if(e.type===1){
      e.x+=e.vx*dt;
      if(e.x<e.r){e.x=e.r;e.vx*=-1}
      else if(e.x>480-e.r){e.x=480-e.r;e.vx*=-1}
    }
    if(inv<=0){
      const dx=e.x-P.x,dy=e.y-P.y;
      if(dx*dx+dy*dy<(e.r+P.r)**2){
        en.splice(i,1);burst(e.x,e.y,'226,169,206');
        lives--;lvEl.textContent=lives;inv=60;snd('hurt');
        combo=0;comboTimer=0;cbEl.style.display='none';
        shake=20;
        energy=Math.floor(energy*0.5);
        if(lives<=0){gameOver();return}
        continue;
      }
    }
    if(e.y>850)en.splice(i,1);
  }

  for(let bi=bul.length-1;bi>=0;bi--){
    const b=bul[bi];
    let hit=false;
    for(let ei=en.length-1;ei>=0;ei--){
      const e=en[ei],dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<(e.r+b.r)**2){
        bul.splice(bi,1);
        e.hp--;
        if(e.hp<=0){
          en.splice(ei,1);
          burst(e.x,e.y,'226,169,206');
          combo++;comboTimer=180;
          const mult=Math.min(3,1+Math.floor(combo/3));
          score+=10*mult;scEl.textContent=score;
          if(mult>1){cbEl.textContent='×'+mult;cbEl.style.display='inline'}
          /* 能量积累：每次 +5（攒满需要 20 个） */
          energy=Math.min(100,energy+5);
          if(energy>=100 && rapidT<=0){
            energy=0;rapidT=1200;   /* 20 秒 */
            snd('rapid');
            shake=8;
            shock.push({x:P.x,y:P.y,r:P.r,max:120,life:1});
          }
        } else {
          burst(e.x,e.y,'248,180,180');
        }
        snd('hit');
        hit=true;break;
      }
    }
    if(hit)continue;
  }

  for(let i=shock.length-1;i>=0;i--){
    const s=shock[i];
    s.r+=6*dt;s.life-=.03*dt;
    if(s.life<=0)shock.splice(i,1);
  }

  const decay=Math.pow(0.96,dt);
  for(let i=pt.length-1;i>=0;i--){
    const p=pt[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=decay;p.vy*=decay;p.life-=.02*dt;
    if(p.life<=0)pt.splice(i,1);
  }
}

function draw(){
  if(over||!started||block())return;
  cx.clearRect(0,0,480,800);

  cx.save();
  if(shake>0){
    const m=shake*0.6;
    cx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);
  }

  cx.fillStyle='rgba(255,255,255,.05)';
  for(let i=0;i<50;i++){
    cx.beginPath();
    cx.arc((i*97)%480,(fc*.5+i*131)%800,1.5,0,7);
    cx.fill();
  }

  const rgb=playerColor[2],hex=playerColor[1];

  P.tr.forEach((t,i)=>{
    cx.beginPath();
    cx.arc(t.x,t.y,P.r*i/P.tr.length,0,7);
    cx.fillStyle=`rgba(${rgb},${t.a*.4})`;
    cx.fill();
  });

  cx.shadowBlur=15;cx.shadowColor=`rgba(${rgb},.8)`;
  cx.beginPath();cx.arc(P.x,P.y,P.r,0,7);cx.fillStyle=hex;cx.fill();
  cx.shadowBlur=0;

  if(energy>0&&rapidT<=0){
    const a0=-Math.PI/2;
    const a1=a0+Math.PI*2*(energy/100);
    cx.strokeStyle=`rgba(${rgb},${0.25+energy/100*0.45})`;
    cx.lineWidth=1.5;
    cx.lineCap='round';
    cx.beginPath();
    cx.arc(P.x,P.y,P.r+7,a0,a1);
    cx.stroke();
  }

  if(rapidT>0){
    const t=performance.now()/220;
    const breath=0.5+Math.sin(t)*0.5;
    cx.shadowBlur=22;
    cx.shadowColor='rgba(168,230,207,.7)';
    cx.strokeStyle=`rgba(168,230,207,${0.4+breath*0.4})`;
    cx.lineWidth=1.5;
    cx.beginPath();cx.arc(P.x,P.y,P.r+6+breath*3,0,7);cx.stroke();
    cx.shadowBlur=0;
  }

  cx.shadowBlur=10;cx.shadowColor=`rgba(${rgb},.8)`;cx.fillStyle=hex;
  bul.forEach(b=>{cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill()});

  cx.shadowColor='rgba(226,169,206,.8)';
  en.forEach(e=>{
    cx.save();cx.translate(e.x,e.y);cx.rotate(e.rt);
    cx.shadowBlur=12;
    if(e.type===0){
      cx.fillStyle='#e2a9ce';
      cx.beginPath();
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3,px=Math.cos(a)*e.r,py=Math.sin(a)*e.r;
        i?cx.lineTo(px,py):cx.moveTo(px,py);
      }
      cx.closePath();cx.fill();
    } else if(e.type===1){
      cx.fillStyle='#f0b8d6';
      cx.beginPath();
      for(let i=0;i<3;i++){
        const a=i*2*Math.PI/3-Math.PI/2,px=Math.cos(a)*e.r,py=Math.sin(a)*e.r;
        i?cx.lineTo(px,py):cx.moveTo(px,py);
      }
      cx.closePath();cx.fill();
    } else {
      if(e.hp>=2){
        cx.strokeStyle='#e2a9ce';cx.lineWidth=2;
        cx.beginPath();cx.arc(0,0,e.r,0,7);cx.stroke();
      }
      cx.fillStyle='#e2a9ce';
      cx.beginPath();cx.arc(0,0,e.r*(e.hp>=2?0.5:0.7),0,7);cx.fill();
    }
    cx.restore();
  });
  cx.shadowBlur=0;

  cx.shadowBlur=8;cx.shadowColor='rgba(248,180,180,.8)';
  pt.forEach(p=>{
    cx.globalAlpha=p.life;
    cx.fillStyle=`rgba(${p.c})`;
    cx.beginPath();cx.arc(p.x,p.y,3*p.life,0,7);cx.fill();
  });
  cx.globalAlpha=1;cx.shadowBlur=0;

  shock.forEach(s=>{
    cx.strokeStyle=`rgba(168,230,207,${s.life*0.7})`;
    cx.lineWidth=2;
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.stroke();
  });

  cx.restore();

  if(flash>0){
    cx.fillStyle=`rgba(255,255,255,${flash/25*0.5})`;
    cx.fillRect(0,0,480,800);
  }
}

let lastTime=0;
function loop(now){
  if(!lastTime)lastTime=now;
  const dtMs=Math.min(50,now-lastTime);
  lastTime=now;
  const dt=dtMs/16.667;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

renderColors();
$('d'+diff[0]).classList.add('on');
upLang();
</script>
